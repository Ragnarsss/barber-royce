    <!-- Letrero de neón de entrada (BR-054, BR-057, BR-123): se pinta antes del JavaScript, colgado sobre una pared de
         ladrillo; src/loader/neonLoader.ts lo apaga cuando la primera página ya está pintada. Los trazados son los de
         src/assets/neon-name.svg (un test exige que coincidan). Sin scripts en línea: la CSP solo permite estilos. -->
    <style id="neon-loader-css">
      /* Tiempos: copia de NEON_LOADER en neonLoader.ts (un test los compara). Colores: valores de los tokens. */
      #neon-loader {
        --neon-min:2200ms; --neon-exit:600ms; --neon-max:8000ms;
        --brick:#2c1b18; --mortar:#0f0c0b; --glow:#d52323;
        --bw:64px; --bh:24px;
        position:fixed; inset:0; z-index:10001; display:grid; place-items:center; padding:24px;
        overflow:hidden; isolation:isolate; background:#1a1a1a;
        animation:neon-failsafe var(--neon-exit) ease var(--neon-max) forwards;
      }
      /* Pared: juntas horizontales cada --bh y verticales desfasadas media pieza por hilada, todo con gradientes. */
      #neon-loader::before {
        content:""; position:absolute; inset:0; z-index:-2;
        background:
          conic-gradient(at 2px var(--bh), transparent 75%, var(--mortar) 0) 0 0 / var(--bw) calc(var(--bh) * 2),
          conic-gradient(at 2px var(--bh), transparent 75%, var(--mortar) 0) calc(var(--bw) / 2) var(--bh) / var(--bw) calc(var(--bh) * 2),
          repeating-linear-gradient(var(--mortar) 0 2px, transparent 2px var(--bh)),
          var(--brick);
      }
      /* Viñeta: la pared se pierde en la oscuridad y el letrero queda al centro. */
      #neon-loader::after {
        content:""; position:absolute; inset:0; z-index:-1;
        background:radial-gradient(ellipse 75% 65% at 50% 50%, transparent 20%, color-mix(in srgb, var(--mortar) 94%, transparent) 100%);
      }
      /* Luz del letrero sobre la pared: crece con cada pieza que se enciende y tiembla con la letra defectuosa. */
      #neon-loader .wall-glow {
        position:absolute; inset:0; z-index:-1; pointer-events:none; opacity:0;
        background:radial-gradient(ellipse 55% 42% at 50% 50%, color-mix(in srgb, var(--glow) 30%, transparent), transparent 72%);
        animation:neon-wall 1620ms steps(1,end) 100ms forwards;
      }
      #neon-loader svg { width:min(560px, calc(100vw - 48px)); height:auto; overflow:visible; }
      #neon-loader use { fill:none; stroke:currentColor; stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; }
      #neon-loader .off { color:#aa3939; opacity:.22; }
      #neon-loader .halo { color:#d52323; stroke-width:2.6; filter:blur(6px); }
      #neon-loader .core { color:color-mix(in srgb, #d52323 30%, #ffffff); filter:drop-shadow(0 0 2px #d52323) drop-shadow(0 0 8px #d52323) drop-shadow(0 0 18px #d52323); }
      @media (min-width: 769px) { #neon-loader { --bw:88px; --bh:32px; } }
      /* La Serena (BR-104): neón frío; el neón solo luce sobre oscuro. Valores de --color-espresso, --color-bark, --color-neon,
         --color-brick-serena y --color-mortar-serena (los tests los comparan; estas reglas van compactas por esos tests). */
      [data-branch="la-serena"] #neon-loader{background:#2b211b;--brick:#3a2a20;--mortar:#17110d;--glow:#eaf4ff}
      [data-branch="la-serena"] #neon-loader .off{color:#6b5a4c}
      [data-branch="la-serena"] #neon-loader .halo{color:#eaf4ff}
      [data-branch="la-serena"] #neon-loader .core{color:#ffffff;filter:drop-shadow(0 0 2px #eaf4ff) drop-shadow(0 0 8px #eaf4ff) drop-shadow(0 0 18px #eaf4ff)}
      /* Encendido por piezas: marco, «Barber», «Royce», tijera y, al final, la letra defectuosa. */
      #neon-loader .lit { opacity:0; animation:neon-ignite 600ms steps(1,end) var(--lit-delay) forwards; }
      #neon-loader .lit-1 { --lit-delay:100ms; }
      #neon-loader .lit-2 { --lit-delay:280ms; }
      #neon-loader .lit-3 { --lit-delay:460ms; }
      #neon-loader .lit-4 { --lit-delay:640ms; }
      #neon-loader .lit-5 { --lit-delay:820ms; }
      #neon-loader .lit-defect { animation:neon-ignite-defect 900ms steps(1,end) var(--lit-delay) forwards; }
      /* Salida: el letrero y su luz se apagan en seco, y después la pared se desvanece. */
      #neon-loader[data-state="exiting"] { opacity:0; pointer-events:none; transition:opacity calc(var(--neon-exit) - 150ms) ease 150ms; }
      #neon-loader[data-state="exiting"] .lit,
      #neon-loader[data-state="exiting"] .wall-glow { animation:none; opacity:0; transition:opacity 90ms ease; }
      @keyframes neon-ignite{0%{opacity:0}20%{opacity:1}35%{opacity:.15}50%,100%{opacity:1}}
      @keyframes neon-ignite-defect{0%{opacity:0}15%{opacity:1}28%{opacity:.1}45%{opacity:1}62%{opacity:.2}75%,100%{opacity:1}}
      @keyframes neon-wall{0%{opacity:0}7%{opacity:.3}12%{opacity:.1}16%{opacity:.4}22%{opacity:.55}33%{opacity:.7}44%{opacity:.8}60%{opacity:.62}68%{opacity:.85}78%{opacity:.66}86%,100%{opacity:1}}
      @keyframes neon-failsafe{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion: reduce) {
        #neon-loader .lit, #neon-loader .lit-defect, #neon-loader .wall-glow { animation:none; opacity:1; }
      }
    </style>
    <!-- Sin JavaScript (BR-123): el letrero se queda encendido con un aviso, en vez de retirarse y dejar la página vacía. -->
    <noscript>

      </style>
    </noscript>
